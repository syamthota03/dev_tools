<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Input Types</title>
</head>
<body>
    <h2>HTML5 Input Types</h2>

    <form>
        Name:
        <input type="text" required>
        <br><br>

        Email:
        <input type="email" required>
        <br><br>

        Age:
        <input type="number" min="1" max="100">
        <br><br>

        Date:
        <input type="date">
        <br><br>

        Time:
        <input type="time">
        <br><br>

        Month:
        <input type="month">
        <br><br>

        Week:
        <input type="week">
        <br><br>

        Favorite Color:
        <input type="color">
        <br><br>

        Range:
        <input type="range" min="0" max="100">
        <br><br>

        Website:
        <input type="url">
        <br><br>

        Phone:
        <input type="tel">
        <br><br>

        Location:
        <input type="text" placeholder="Enter your location">
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
