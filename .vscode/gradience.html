
<!DOCTYPE html>
<html>
<head>
    <title>CSS Linear Gradients</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .box1 {
            height: 200px;
            background-image: linear-gradient(to bottom, rgba(208, 60, 60, 0.812), rgb(50, 221, 124));
        }

        .box2 {
            height: 200px;
            background-image: linear-gradient(to top, rgba(225, 69, 95, 0.648), rgba(81, 152, 222, 0.637));
        }

        .box3 {
            height: 200px;
            background-image: linear-gradient(to left, rgba(222, 163, 54, 0.692), rgba(131, 48, 48, 0.522));
        }

        .box4 {
            height: 200px;
            background-image: linear-gradient(to right, rgba(156, 55, 75, 0.619), rgba(229, 229, 68, 0.627));
        }

        .box5 {
            height: 200px;
            background-image: linear-gradient(to bottom right, rgba(71, 188, 71, 0.595), rgba(66, 66, 232, 0.533));
        }

        .box6 {
            height: 200px;
            background-image: linear-gradient(to bottom left, rgba(220, 59, 59, 0.722), rgba(70, 152, 152, 0.766));
        }

        .box7 {
            height: 200px;
            background-image: linear-gradient(to top right, rgba(195, 150, 67, 0.73), rgba(73, 73, 163, 0.621));
        }

        .box8 {
            height: 200px;
            background-image: linear-gradient(to top left, rgba(146, 146, 228, 0.689), rgba(224, 104, 124, 0.673));
        }
        
    </style>
</head>

<body>
    <h1>CSS Linear Gradients</h1>

    <div class="box1">To Bottom</div>
    <div class="box2">To Top</div>
    <div class="box3">To Left</div>
    <div class="box4">To Right</div>
    <div class="box5">To Bottom Right</div>
    <div class="box6">To Bottom Left</div>
    <div class="box7">To Top Right</div>
    <div class="box8">To Top Left</div>
</body>
</html>
