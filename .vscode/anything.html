<!DOCTYPE html>
<html>
<head>
<title>linear gradient</title>
<style>
.box1{
height:200px;
background-image:linear-gradient(to bottom, rgb(143, 105, 35),rgb(196, 188, 188),rgb(63, 63, 96));
}
.box2{
height:200px;
background-image:linear-gradient(to top, rgb(166, 80, 80) ,rgb(255, 0, 76),rgb(192, 110, 124));
}
.box3{
height:200px;
background-image:linear-gradient(to right, rgb(235, 180, 76),rgb(113, 113, 43),rgb(61, 142, 61));
}
.box4{
height:200px;
background-image:linear-gradient(to left, rgb(65, 65, 117),rgb(139, 87, 87),green);
}
.box5{
height:200px;
background-image:linear-gradient(to bottom right,rgb(126, 79, 126),rgb(170, 129, 200),rgb(66, 66, 107));
}
.box6{
height:200px;
background-image:linear-gradient(to bottom left, rgb(171, 94, 94),rgb(185, 185, 69),rgb(181, 142, 70) );
}
.box7{
height:200px;
background-image:linear-gradient(to top right,rgb(202, 118, 132),rgb(71, 71, 120),violet);
}
.box8{
height:200px;
background-image:linear-gradient(to top left,rgb(180, 98, 114),rgb(144, 81, 144),rgb(31, 139, 167));
}
.box9{
     background-image:linear-gradient(190deg,rgb(102, 175, 121),rgb(137, 112, 64));
}
.box10{
     background-image:linear-gradient(270deg,rgba(64, 135, 179, 0.566),rgba(167, 55, 124, 0.749);)
}
.box11{
    height: 200px;
    background-image: repeating-linear-gradient( 45 deg,lightblue 45%,light green 30%));
}
body{
     text-align:center;
}
</style>
</head>
<body>
<div class="box1"><h1>to bottom</h1></div>
<div class="box2"><h1>to top</h1></div>
<div class="box3"><h1>to right</h1></div>
<div class="box4"><h1>to left</h1></div>
<div class="box5"><h1>to bottomright</h1></div>
<div class="box6"><h1>to bottomleft</h1></div>
<div class="box7"><h1>to topright</h1></div>
<div class="box8"><h1>to topright</h1></div>
<div class="box9"><h1>angle</h1></div>
<div class="box10"><h1>angle</h1></div>
<div class="box11"><h1>repeating-linear-gradient</h1></div>
</body>
</html>
