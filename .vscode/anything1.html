<!DOCTYPE HTML>
<html>
    <head>
        <title>align-text</title>
        <style>
            .container{
                display: flex;
                height:500px;
                background-color: rgb(58, 192, 197);
                align-items: flex-start;
                gap: 10px;
            }
            .box{
                width:50px;
                padding:20px;
                background-color:lightgreen;
                text-align: center;
            }
            .box1{
                align-self: flex-start;}
                .box2{
                    align-self: center;}
                    .box3{
                        align-items: flex-end;
                    }
                    </style>
                    </head>
                    <body>
                        <h2>css align-self examples</h2>
                        <div class ="container">
                            <div class="box box1">box1</div>
                            <div class="box box2">box 2</div>
                            <div class="box box3">box 3</div>
                        </div>
                    </body>
</html>
