<!DOCTYPE html>
<html>
<head>
    <title>Boxes</title>
    <style>
        body {
            margin: 0;
            background-color:black;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 50%;
            margin: 30px auto;
            padding: 45px 35px;
            border: 4px solid white;
            box-sizing: border-box;
        }
        .box-container{
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 40px 55px;
        }
        .box {
            height: 130px;
            border: 5px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 38px;
            font-weight: bold;
            box-sizing: border-box;
        }

        @media (max-width: 700px) {
            .container {
                width: 95%;
                padding: 25px 15px;
            }

            .box-container {
                gap: 20px;
            }

            .box {
                height: 90px;
                font-size: 25px;
            }
        }

          </style>
</head>

<body>

    <div class="container">
    
         <div class="box-container">
            <div class="box">1</div>
            <div class="box">2</div>
            <div class="box">3</div>
            <div class="box">4</div>
            <div class="box">5</div>
            <div class="box">6</div>
            <div class="box">7</div>
            <div class="box">8</div>
            <div class="box">9</div>
            <div class="box">10</div>
         </div>
    </div>
        </body>
</html>
