<!DOCTYPE html>
<html>
<head>
    <title>Linear Gradient</title>

    <style>
        h1 {
            text-align: center;
        }

        .box1{
            height: 200px;
            background-image: linear-gradient(45deg, red, yellow);
        }

        .box2{
            height: 200px;
            background-image: linear-gradient(90deg, blue, pink);
        }

        .box3{
            height: 200px;
            background-image: linear-gradient(180deg, green, orange);
        }

        .box4{
            height: 200px;
            background-image: linear-gradient(270deg, purple, cyan);
        }
    </style>
</head>

<body>

    <h1>CSS Linear Gradient Examples</h1>

    <div class="box1">
        <h1>TO BOTTOM</h1>
    </div>
    <br><br>

    <div class="box2">
        <h1>TO TOP</h1>
    </div>
    <br><br>

    <div class="box3">
        <h1>TO RIGHT</h1>
    </div>
    <br><br>

    <div class="box4">
        <h1>TO LEFT</h1>
    </div>

</body>
</html>
