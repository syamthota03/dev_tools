<!DOCTYPE html>
<html>
<head>
    <title>Diagonal Linear Gradient</title>

    <style>
        h1 {
            text-align: center;
        }

        .box1 {
            height: 200px;
            background-image: linear-gradient(to bottom left, red, yellow);
        }

        .box2 {
            height: 200px;
            background-image: linear-gradient(to bottom right, blue, pink);
        }

        .box3 {
            height: 200px;
            background-image: linear-gradient(to top left, green, orange);
        }

        .box4 {
            height: 200px;
            background-image: linear-gradient(to top right, purple, cyan);
        }
    </style>
</head>

<body>

    <h1>CSS Diagonal Linear Gradient Examples</h1>

    <div class="box1">
        <h1>To Bottom Left</h1>
    </div>
    <br><br>

    <div class="box2">
        <h1>To Bottom Right</h1>
    </div>
    <br><br>

    <div class="box3">
        <h1>To Top Left</h1>
    </div>
    <br><br>

    <div class="box4">
        <h1>To Top Right</h1>
    </div>
    <br><br>

</body>
</html>
