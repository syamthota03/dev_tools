<!DOCTYPE html>
<html>
<head>
    <title>Repeating Radial Gradient</title>

    <style>
        h1 {
            text-align: center;
        }

        .box1 {
            height: 200px;
            background-image: linear-gradient(to right, red, yellow, green);
        }

        .box2 {
            height: 250px;
            background-image: repeating-radial-gradient(red, yellow 10%, blue 20%);
        }

        .box3 {
            height: 250px;
            background-image: repeating-radial-gradient(circle, blue, pink 10%, purple 20%);
        }

        .box4 {
            height: 250px;
            background-image: repeating-radial-gradient(circle, green, orange 10%, yellow 20%);
        }
    </style>
</head>

<body>

    <h1>CSS Repeating Radial Gradient Examples</h1>

    <div class="box1">
        <h1>Linear Gradient</h1>
    </div>
    <br><br>

    <div class="box2">
        <h1>Repeating Radial Gradient</h1>
    </div>
    <br><br>

    <div class="box3">
        <h1>Repeating Radial Circle Gradient</h1>
    </div>
    <br><br>

    <div class="box4">
        <h1>Repeating Radial Gradient</h1>
    </div>

</body>
</html>
