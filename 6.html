<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>styles</title>
    <style>
        h1{ background-color:darkgreen;
            text-align: center;
            color: burlywood;
        }
        h2{
            background-color: indigo;
            text-align: right;
            color: crimson;
        }
        h3{
            background-color: deepskyblue;
            text-align: left;
            color:black;
        }
        p{  background-color:darkblue;
            color: darkgoldenrod;
            text-align: justify;
        }
        
    </style>
</head>
<body>
    <h1>CSS stands for Cascading Style Sheets.</h1>
    <h2>It is used to style and design web pages.</h2>
    <h3>CSS controls colors, fonts, layouts, spacing, and sizes.</h3>
    <p>It helps make websites attractive and responsive on different devices.</p>
</body>
</html>
