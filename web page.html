<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body { font-family: Arial; background:darkorange }
        nav { background:chocolate; padding: 15px; text-align: center; }
        nav a { color:black; margin: 15px; text-decoration: none; }
        .box { width: 400px; margin: 30px auto; padding: 20px;
               background: white; border-radius: 10px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0;}
        button { padding: 10px; background:maroon; color:whitesmoke; border: 0;}
    </style>
</head>

<body>

<nav>
    <a href="#home">Home</a>
    <a href="#signin">Sign In</a>
    <a href="#signup">Sign Up</a>
    <a href="#about">About Us</a>
    <a href="#contact">Contact</a>
</nav>

<div class="box" id="home">
    <h1>Welcome to Our Website</h1>
</div>

<div class="box" id="signin">
    <h2>Sign In</h2>
    <input type="text" placeholder="User Name">
    <input type="password" placeholder="Password">
    <button>Submit</button>
</div>

<div class="box" id="signup">
    <h2>Sign Up</h2>
    <input type="text" placeholder="Full Name">
    <input type="text" placeholder="User Name">
    <input type="email" placeholder="Email">
    <input type="tel" placeholder="Phone">
    <input type="password" placeholder="Password">
    <input type="date">
    <input type="text" placeholder="Address">
    <input type="text" placeholder="City">
    <input type="text" placeholder="State">
    <input type="text" placeholder="PIN Code">
    <button>Submit</button>
</div>

<div class="box" id="about">
    <h2>About Us</h2>
    <p>Our website provides simple and useful online services.</p>
</div>

<div class="box" id="contact">
    <h2>Contact Us</h2>
    <p>Email: @gmail.com</p>
    <p>Phone: +91  91216 52890</p>
</div>

</body>
</html>
